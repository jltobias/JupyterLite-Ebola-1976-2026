name: Publish Ebola StoryMap, Book, and Lab

on:
  push:
    branches: [main]
    paths:
      - 'storymap/**'
      - 'book/**'
      - 'lab/**'
      - 'scripts/**'
      - 'requirements-site.txt'
      - '.github/workflows/storymap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install site builders
        run: python -m pip install -r requirements-site.txt
      - name: Build StoryMap, Book, and Lab
        run: python scripts/build_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload complete site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy complete site
        id: deployment
        uses: actions/deploy-pages@v4
