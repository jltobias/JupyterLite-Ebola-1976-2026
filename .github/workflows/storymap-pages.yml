name: Publish Ebola StoryMap

on:
  push:
    branches: [main]
    paths:
      - 'storymap/**'
      - '.github/workflows/storymap-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload StoryMap
        uses: actions/upload-pages-artifact@v4
        with:
          path: storymap
      - name: Deploy StoryMap
        id: deployment
        uses: actions/deploy-pages@v4
